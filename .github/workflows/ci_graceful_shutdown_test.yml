name: Graceful Shutdown Test (internal verification)

on:
  push:
    branches:
      - ev/feat/graceful-http-shutdown

jobs:
  test:
    runs-on: default-bci-tools-k8s-runners
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run graceful shutdown tests
        run: ./gradlew :core:test --tests "tech.pegasys.web3signer.core.RunnerGracefulShutdownTest" --info

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: core/build/reports/tests/test/
          retention-days: 3
